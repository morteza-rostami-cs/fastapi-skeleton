<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body class="bg-gray-100">
    <div id="app" class="min-h-screen flex items-center justify-center">
      <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6">Register</h1>

        <form @submit.prevent="register">
          <div class="mb-4">
            <label class="block mb-2 text-sm font-medium"> Name </label>

            <input
              v-model="name"
              type="text"
              class="w-full border rounded-lg px-4 py-2"
              placeholder="Your name"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white rounded-lg px-4 py-2"
          >
            Register
          </button>
        </form>

        <p v-if="message" class="mt-4 text-green-600">{{ message }}</p>
      </div>

      <user-card name="guest user" description="registration page" />
    </div>

    <script src="/static/js/state.js"></script>
    <script src="/static/components/user-card.js"></script>
    <script>
      const { createApp } = Vue;

      createApp({
        // components
        components: {
          UserCard,
        },

        data() {
          return {
            name: "",
            message: "",
          };
        },

        methods: {
          register() {
            this.message = `Hello ${this.name}! Registration will come later.`;
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
