<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fastapi skeleton</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1 class="bg-red-200 p-2 text-2xl">{{ message }}</h1>
    </div>

    <script>
      const { createApp } = Vue;

      const app = createApp({
        data() {
          return {
            message: "hello from vue js",
          };
        },
      });

      // mounting the vue application
      app.mount("#app");
    </script>
  </body>
</html>
